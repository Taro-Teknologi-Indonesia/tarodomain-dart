name: tarodomain_workspace
publish_to: none

environment:
  sdk: ^3.12.2

workspace:
  - packages/tarodomain
  - packages/tarodomain_local
  - packages/tarodomain_testing
  - packages/tarodomain_serverpod_server
  - packages/tarodomain_serverpod_client
  - examples/bank_account
  - examples/bank_account_serverpod/bank_account_serverpod_server
  - examples/bank_account_serverpod/bank_account_serverpod_client
  - examples/gavel/gavel_server
  - examples/gavel/gavel_client
  - examples/gavel/gavel_flutter

dev_dependencies:
  lints: ^6.1.0
  melos: ^8.9.0

melos:
  scripts:
    analyze:
      run: dart analyze --fatal-infos
      description: Analyze every package.
    format:
      run: dart format .
      description: Format every package.
    format:check:
      run: dart format --output=none --set-exit-if-changed .
      description: Fail if any file is not formatted.
    test:
      # One package at a time: the Serverpod packages each start an embedded
      # PostgreSQL on port 9090, and workspace packages share .dart_tool.
      exec:
        command: dart test
        concurrency: 1
      description: Run tests in every package that has a test folder.
      packageFilters:
        dirExists: test
