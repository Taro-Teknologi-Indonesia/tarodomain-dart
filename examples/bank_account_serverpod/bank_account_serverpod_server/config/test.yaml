# Tests: every port is 0, so the server picks a free one, and each test
# group gets its own SQLite file next to this one.

apiServer:
  port: 0
  publicHost: localhost
  publicPort: 0
  publicScheme: http

insightsServer:
  port: 0
  publicHost: localhost
  publicPort: 0
  publicScheme: http

database:
  dialect: sqlite
  filePath: db/test.db

sessionLogs:
  persistentEnabled: false
  consoleEnabled: false
