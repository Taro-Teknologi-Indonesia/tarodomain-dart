<!DOCTYPE html>
<html>
<head>
  <!--
    If you are serving your web app in a path other than the root, change the
    href value below to reflect the base path you are serving from.

    The path provided below has to start and end with a slash "/" in order for
    it to work correctly.

    For more details:
    * https://developer.mozilla.org/en-US/docs/Web/HTML/Element/base

    This is a placeholder for base href that will be replaced by the value of
    the `--base-href` argument provided to `flutter build`.
  -->
  <base href="$FLUTTER_BASE_HREF">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="description" content="A new Flutter project.">

  <!-- iOS meta tags & icons -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="apple-mobile-web-app-title" content="gavel_flutter">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">

  <!-- Favicon -->
  <link rel="icon" type="image/png" href="favicon.png"/>

  <title>Gavel</title>
  <link rel="manifest" href="manifest.json">

  <!-- Splash shown while Flutter downloads and boots; removed on first frame. -->
  <style>
    #gavel-loading {
      position: fixed;
      inset: 0;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 20px;
      background: #fffbff;
      font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
      color: #8d5524;
      transition: opacity 250ms ease-out;
    }
    #gavel-loading.done { opacity: 0; pointer-events: none; }
    #gavel-loading .spinner {
      width: 44px;
      height: 44px;
      border: 4px solid rgba(141, 85, 36, 0.2);
      border-top-color: #8d5524;
      border-radius: 50%;
      animation: gavel-spin 0.9s linear infinite;
    }
    #gavel-loading .title { font-size: 22px; font-weight: 600; letter-spacing: 0.02em; }
    #gavel-loading .hint { font-size: 14px; opacity: 0.7; }
    @keyframes gavel-spin { to { transform: rotate(360deg); } }
  </style>
</head>
<body>
  <div id="gavel-loading" role="status" aria-live="polite">
    <div class="spinner"></div>
    <div class="title">Gavel</div>
    <div class="hint">Loading auction&hellip;</div>
  </div>
  <script>
    window.addEventListener('flutter-first-frame', function () {
      var el = document.getElementById('gavel-loading');
      if (!el) return;
      el.classList.add('done');
      setTimeout(function () { el.remove(); }, 300);
    });
  </script>
  <!--
    You can customize the "flutter_bootstrap.js" script.
    This is useful to provide a custom configuration to the Flutter loader
    or to give the user feedback during the initialization process.

    For more details:
    * https://docs.flutter.dev/platform-integration/web/initialization
  -->
  <script src="flutter_bootstrap.js" async></script>
</body>
</html>
