name: gavel_flutter
description: Gavel's Flutter web app, served by gavel_server.
publish_to: none
version: 0.1.0+1
resolution: workspace

environment:
  sdk: ^3.12.2

dependencies:
  flutter:
    sdk: flutter
  flutter_web_plugins:
    sdk: flutter
  gavel_client: any
  go_router: ^17.0.0
  intl: any
  serverpod_flutter: 4.0.4
  shared_preferences: ^2.5.0
  tarodomain_serverpod_client: ^0.0.1
  web: ^1.1.1

dev_dependencies:
  flutter_test:
    sdk: flutter

flutter:
  uses-material-design: true
  # Bundled rather than fetched, so the first frame already has them. Both
  # are SIL OFL 1.1; the licenses sit beside the files.
  fonts:
    - family: Plus Jakarta Sans
      fonts:
        - asset: assets/fonts/PlusJakartaSans-Regular.ttf
        - asset: assets/fonts/PlusJakartaSans-Medium.ttf
          weight: 500
        - asset: assets/fonts/PlusJakartaSans-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/PlusJakartaSans-Bold.ttf
          weight: 700
        - asset: assets/fonts/PlusJakartaSans-ExtraBold.ttf
          weight: 800
    - family: Playfair Display
      fonts:
        - asset: assets/fonts/PlayfairDisplay-Bold.ttf
          weight: 700
