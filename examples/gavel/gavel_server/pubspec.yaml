name: gavel_server
description: Gavel, a live silent auction that closes itself, served by Serverpod on PostgreSQL.
publish_to: none
resolution: workspace

environment:
  sdk: ^3.12.2

dependencies:
  crypto: ^3.0.6
  serverpod: 4.0.4
  tarodomain: ^0.0.1
  tarodomain_serverpod_server: ^0.0.1

dev_dependencies:
  lints: ^6.1.0
  serverpod_test: 4.0.4
  tarodomain_local: ^0.0.1
  tarodomain_testing: ^0.0.1
  test: ^1.31.1

serverpod:
  scripts:
    # Builds the Flutter web app into web/app. `serverpod cloud deploy` runs
    # it before every upload.
    flutter_build: ../tool/build_web.sh
