# Local development: API on 8080, insights on 8081 and the Flutter web app on
# 8082. Serverpod starts and manages an embedded PostgreSQL in `.serverpod/`,
# so no Docker is needed.

apiServer:
  port: 8080
  publicHost: localhost
  publicPort: 8080
  publicScheme: http

insightsServer:
  port: 8081
  publicHost: localhost
  publicPort: 8081
  publicScheme: http

webServer:
  port: 8082
  publicHost: localhost
  publicPort: 8082
  publicScheme: http

database:
  host: localhost
  port: 8090
  name: gavel
  user: postgres
  dataPath: .serverpod/development/pgdata

maxRequestSize: 524288

sessionLogs:
  persistentEnabled: true
  consoleEnabled: true
  consoleLogFormat: text

futureCall:
  scanInterval: 1000
