# Passwords for the local embedded PostgreSQL only, which accepts any
# password. Production passwords never go here: Serverpod Cloud supplies the
# database password, and other secrets are set with
# `serverpod cloud password set`.

development:
  database: 'gavel_local'
  # Throwaway local values for the auth module (X6).
  jwtHmacSha512PrivateKey: 'local-only-jwt-key-not-for-production'
  jwtRefreshTokenHashPepper: 'local-only-refresh-pepper'
  emailSecretHashPepper: 'local-only-email-pepper'

test:
  database: 'gavel_local'
  jwtHmacSha512PrivateKey: 'local-only-jwt-key-not-for-production'
  jwtRefreshTokenHashPepper: 'local-only-refresh-pepper'
  emailSecretHashPepper: 'local-only-email-pepper'
