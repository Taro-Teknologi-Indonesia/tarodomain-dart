# Tests: every port is 0, so the server picks a free one. Serverpod starts
# and manages an embedded PostgreSQL in `.serverpod/test/`, shared by every
# test file, so `dart_test.yaml` runs the files one at a time.

apiServer:
  port: 0
  publicHost: localhost
  publicPort: 0
  publicScheme: http

insightsServer:
  port: 0
  publicHost: localhost
  publicPort: 0
  publicScheme: http

database:
  host: localhost
  port: 9090
  name: gavel_test
  user: postgres
  dataPath: .serverpod/test/pgdata

sessionLogs:
  persistentEnabled: false
  consoleEnabled: false
